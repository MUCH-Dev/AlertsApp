<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Watchtower Alerts App</title>
<link rel="icon" type="image/png" href="watchtower-icon-64.png">
<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@2.38.3/lib/msal-browser.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap');

  :root{
    --bg:#F3F5F8;
    --surface:#FFFFFF;
    --ink:#18212F;
    --muted:#66748A;
    --border:#E3E8EF;
    --pending:#C2760C;
    --pending-bg:#FDF3E3;
    --pulled:#2B5FD9;
    --pulled-bg:#EAF0FE;
    --entered:#0E8F79;
    --entered-bg:#E4F6F1;
    --critical:#C4432E;
    --critical-bg:#FBE7E3;
    --snoozed:#7C5CBF;
    --snoozed-bg:#F1ECFB;
    --accent:#2B5FD9;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  /* ---- Sign-in gate ---- */
  #signinScreen{ min-height:100vh; display:flex; align-items:center; justify-content:center; }
  #signinScreen .card{
    background:var(--surface); border:1px solid var(--border); border-radius:14px;
    padding:40px; text-align:center; box-shadow:0 3px 14px rgba(24,33,47,.08);
  }
  #signinScreen h1{ font-family:'Space Grotesk'; font-weight:700; font-size:20px; margin:0 0 8px; }
  #signinScreen p{ color:var(--muted); margin-bottom:20px; font-size:14px; }
  button.primary{
    background:var(--accent); color:#fff; border:none; padding:10px 20px;
    border-radius:9px; font-size:14px; font-weight:600; cursor:pointer; font-family:inherit;
  }
  button.primary:hover{ background:#3a6ef0; }

  /* ---- App shell ---- */
  .app{ max-width:1240px; margin:0 auto; padding:28px 24px 80px; display:none; }

  .topbar{
    display:flex; justify-content:space-between; align-items:flex-start;
    margin-bottom:22px; flex-wrap:wrap; gap:16px;
  }
  .brand{ display:flex; align-items:center; gap:12px; }
  .brand-mark{
  width: 60px; height: 60px; border-radius:9px;
  object-fit:cover;
  flex-shrink:0;
}
  .brand h1{ font-family:'Space Grotesk'; font-weight:700; font-size:19px; margin:0; letter-spacing:-0.01em; }
  .brand p{ margin:1px 0 0; font-size:12.5px; color:var(--muted); }
  .who{ display:flex; align-items:center; gap:12px; font-size:12.5px; color:var(--muted); }
  .who button.link{ background:none; border:none; color:var(--accent); cursor:pointer; font-size:12.5px; font-family:inherit; padding:0; }

  /* ---- Metrics strip ---- */
  .metrics{ display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:20px; }
  .metric{ background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:14px 16px; }
  .metric .num{ font-family:'Space Grotesk'; font-size:24px; font-weight:700; }
  .metric .label{ font-size:11.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; margin-top:2px; }
  .metric.pending .num{ color:var(--pending); }
  .metric.critical .num{ color:var(--critical); }
  .metric.entered .num{ color:var(--entered); }

  /* ---- Filter bar ---- */
  .filterbar{
    background:var(--surface); border:1px solid var(--border); border-radius:12px;
    padding:14px 16px; margin-bottom:18px; display:flex; gap:12px; flex-wrap:wrap; align-items:center;
    justify-content:center;
  }
  .field{ display:flex; flex-direction:column; gap:4px; }
  .field label{ font-size:10.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; font-weight:600; }
  .field input:not([type="checkbox"]), .field select{
    border:1px solid var(--border); border-radius:8px; padding:7px 10px; font-size:13.5px;
    font-family:inherit; background:#fff; color:var(--ink); min-width:150px;
  }
  .field.grow{ flex:1; min-width:180px; }
  .status-seg{ display:flex; background:#EEF1F5; border-radius:8px; padding:3px; gap:2px; }
  .status-seg button{
    border:none; background:none; padding:7px 13px; border-radius:6px; font-size:13px; font-weight:600;
    color:var(--muted); cursor:pointer; font-family:inherit;
  }
  .status-seg button.active{ background:#fff; color:var(--ink); box-shadow:0 1px 2px rgba(24,33,47,.12); }

  /* ---- View toggle ---- */
  .view-toggle{ display:flex; background:#EEF1F5; border-radius:8px; padding:3px; gap:2px; margin-left:12px; }
  .view-toggle button{
    border:none; background:none; padding:6px 10px; border-radius:6px; font-size:14px;
    color:var(--muted); cursor:pointer; font-family:inherit; line-height:1;
  }
  .view-toggle button.active{ background:#fff; color:var(--ink); box-shadow:0 1px 2px rgba(24,33,47,.12); }

  /* ---- Grid (table) view ---- */
  .table-scroll{ overflow:auto; max-height:calc(100vh - 220px); }
  .grid-table{ width:100%; border-collapse:separate; border-spacing:0; background:var(--surface); border:1px solid var(--border); border-radius:12px; }
  .grid-table thead th{
    position:sticky; top:0; background:#F7F8FA; text-align:left; font-size:11px; color:var(--muted);
    text-transform:uppercase; letter-spacing:.04em; padding:9px 10px; border-bottom:1px solid var(--border);
  }
  .grid-table tbody td{ padding:9px 10px; font-size:12.5px; border-bottom:1px solid var(--border); }
  .grid-table tbody tr:last-child td{ border-bottom:none; }
  .grid-table tbody tr:hover{ background:#F7F8FA; }
  .row-card td:first-child{ border-left:4px solid var(--pending); }
  .row-card.status-pulled td:first-child{ border-left-color:var(--pulled); }
  .row-card.status-entered td:first-child{ border-left-color:var(--entered); }
  .row-card.is-critical td:first-child{ border-left-color:var(--critical); }
  .row-card.status-snoozed td:first-child{ border-left-color:var(--snoozed); }

  /* ---- Gallery ---- */
  .gallery{ display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:12px; }
  .card{
    background:var(--surface); border:1px solid var(--border); border-radius:12px;
    padding:12px 14px 13px; position:relative; border-left:4px solid var(--pending);
    transition:box-shadow .15s; cursor:pointer;
  }
  .card:hover{ box-shadow:0 3px 14px rgba(24,33,47,.08); }
  .card.status-pulled{ border-left-color:var(--pulled); }
  .card.status-entered{ border-left-color:var(--entered); opacity:.8; }

  .card-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:8px; }
  .client-code{
    font-family:'IBM Plex Mono'; font-size:11.5px; background:#EEF1F5; color:var(--muted);
    padding:2px 7px; border-radius:5px; letter-spacing:.02em;
  }
  .status-pill{ font-size:11px; font-weight:700; border-radius:12px; padding:3px 10px; white-space:nowrap; }
  .pill-group{ display:flex; gap:6px; align-items:center; }
  .status-pill.pending{ background:var(--pending-bg); color:var(--pending); }
  .status-pill.pulled{ background:var(--pulled-bg); color:var(--pulled); }
  .status-pill.entered{ background:var(--entered-bg); color:var(--entered); }
  .status-pill.critical{ background:var(--critical-bg); color:var(--critical); }
  .status-pill.snoozed{ background:var(--snoozed-bg); color:var(--snoozed); }

  .card.is-critical{ border-left-color:var(--critical); }
  .card.status-snoozed{ border-left-color:var(--snoozed); }

  .card h3{ font-size:15px; margin:8px 0 1px; font-family:'Space Grotesk'; font-weight:600; }
  .vendor{ font-size:12.5px; color:var(--muted); margin:0 0 2px; }
  .account-no{ font-size:12.5px; color:var(--muted); margin:0 0 10px; }

  .card-row{ display:flex; justify-content:space-between; font-size:12.5px; margin-bottom:3px; }
  .card-row span:first-child{ color:var(--muted); }
  .card-row span:last-child{ font-weight:600; font-family:'IBM Plex Mono'; font-size:12px; }

  .notes{
    font-size:12px; color:var(--muted); margin:10px 0 0; padding:8px 10px; background:#F7F8FA;
    border-radius:8px; font-style:italic; line-height:1.4;
  }
  .instructions{
    font-size:12px; color:var(--muted); margin:6px 0 0; padding:8px 10px; background:#F7F8FA;
    border-radius:8px; line-height:1.4;
  }
  .instructions b{ color:var(--ink); font-style:normal; font-weight:600; }

  .card-actions{ display:flex; gap:8px; align-items:center; margin-top:11px; flex-wrap:wrap; }
  .card-actions input[type="text"]{
    flex:1 1 160px; padding:6px 8px; border:1px solid var(--border); border-radius:7px; font-size:12.5px; font-family:inherit;
  }
  .card-actions button.save{
    background:var(--ink); color:#fff; border:none; padding:6px 12px; border-radius:7px;
    font-size:12px; font-weight:600; cursor:pointer; font-family:inherit;
  }
  .card-footer{
    display:flex; justify-content:flex-end; align-items:center; margin-top:11px;
    padding-top:9px; border-top:1px dashed var(--border);
  }
  .snooze-btn{
    font-size:11.5px; font-weight:600; border-radius:7px; padding:5px 11px; cursor:pointer;
    font-family:inherit; border:1px solid var(--snoozed); background:#fff; color:var(--snoozed);
  }
  .snooze-btn:hover{ background:var(--snoozed-bg); }
  .snooze-btn.active{ background:var(--snoozed); color:#fff; }
  .keystone-link{
    font-size:11.5px; font-weight:600; color:var(--accent); text-decoration:none; cursor:pointer;
    display:flex; align-items:center; gap:4px; background:none; border:none; font-family:inherit; padding:0;
  }
  .keystone-link:hover{ text-decoration:underline; }
  .save-status{ font-size:11px; color:var(--muted); }

  .empty-state, .loading-state{ text-align:center; padding:50px 20px; color:var(--muted); font-size:13.5px; grid-column:1/-1; }

  .view-total{ margin-top:14px; font-size:12.5px; color:var(--ink); }

  /* ---- Detail modal ---- */
  #modalOverlay{
    display:none; position:fixed; inset:0; background:rgba(24,33,47,.45);
    align-items:flex-start; justify-content:center; padding:40px 16px; overflow-y:auto; z-index:100;
  }
  #modalOverlay.show{ display:flex; }
  .modal{
    background:var(--surface); border-radius:14px; max-width:560px; width:100%;
    padding:24px 26px 26px; box-shadow:0 10px 40px rgba(24,33,47,.25);
  }
  .modal-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; margin-bottom:4px; }
  .modal-top h2{ font-family:'Space Grotesk'; font-size:18px; margin:0; }
  .modal-close{ background:none; border:none; font-size:20px; color:var(--muted); cursor:pointer; line-height:1; padding:2px; }
  .modal-sub{ font-size:13px; color:var(--muted); margin-bottom:16px; }

  .modal-grid{
    display:grid; grid-template-columns:1fr 1fr; gap:8px 20px; font-size:13px; margin-bottom:16px;
  }
  .modal-grid .k{ color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.04em; margin-bottom:1px; }
  .modal-grid .v{ font-size:12.5px; }

  .modal-field{ margin-bottom:14px; }
  .modal-field label{
    display:block; font-size:10.5px; color:var(--muted); text-transform:uppercase;
    letter-spacing:.05em; font-weight:600; margin-bottom:5px;
  }
  .modal-field textarea, .modal-field input[type="text"], .modal-field select{
    width:100%; border:1px solid var(--border); border-radius:8px; padding:9px 10px;
    font-size:13.5px; font-family:inherit; resize:vertical; background:#fff;
  }
  .modal-field textarea{ min-height:70px; }
  .modal-readonly{
    font-size:12.5px; color:var(--muted); background:#F7F8FA; padding:8px 10px; border-radius:8px; line-height:1.4;
  }

  .modal-actions{ display:flex; justify-content:space-between; align-items:center; margin-top:18px; }
  .modal-save-status{ font-size:12px; color:var(--muted); }
  .modal-buttons{ display:flex; gap:8px; }
  .modal-buttons button.save{
    background:var(--ink); color:#fff; border:none; padding:9px 18px; border-radius:8px;
    font-size:13px; font-weight:600; cursor:pointer; font-family:inherit;
  }
  .modal-buttons button.keystone{
    background:none; border:1px solid var(--accent); color:var(--accent); padding:9px 16px;
    border-radius:8px; font-size:13px; font-weight:600; cursor:pointer; font-family:inherit;
  }

  /* ---- Popup (replaces window.alert) ---- */
  #popupOverlay{
    display:none; position:fixed; inset:0; background:rgba(24,33,47,.45);
    align-items:center; justify-content:center; padding:16px; z-index:200;
  }
  #popupOverlay.show{ display:flex; }
  .popup{
    background:var(--surface); border-radius:14px; max-width:380px; width:100%;
    padding:20px 22px; box-shadow:0 10px 40px rgba(24,33,47,.25); text-align:center;
  }
  .popup-message{ font-size:13.5px; line-height:1.5; margin:0 0 16px; }
  .popup button{
    background:var(--accent); color:#fff; border:none; padding:8px 20px; border-radius:8px;
    font-size:13px; font-weight:600; cursor:pointer; font-family:inherit;
  }
  .popup button:hover{ background:#3a6ef0; }

  /* ---- Batch assign bar ---- */
  .batchbar{
    display:none; align-items:center; gap:10px; background:var(--ink); color:#fff;
    border-radius:12px; padding:11px 16px; margin-bottom:16px; font-size:13.5px; flex-wrap:wrap;
  }
  .batchbar.show{ display:flex; }
  .batchbar select, .batchbar input{
    border:none; border-radius:7px; padding:7px 10px; font-size:13px; font-family:inherit;
  }
  .batchbar .assignField{ margin-left:auto; display:flex; gap:8px; align-items:center; }
  .batchbar button{
    background:var(--accent); color:#fff; border:none; border-radius:7px; padding:7px 14px;
    font-size:13px; font-weight:600; cursor:pointer; font-family:inherit;
  }
  .batchbar button:hover{ background:#3a6ef0; }
  .batchbar button:disabled{ opacity:.5; cursor:not-allowed; }
  .batchbar .snooze-btn{ background:var(--snoozed); color:#fff; border:none; margin-left:auto; }
  .batchbar .snooze-btn:hover{ background:#6d4fa8; }

  .card-check{ display:none; margin-right:6px; }
  .gallery.lead-mode .card-check{ display:inline-block; }
  .grid-table .card-check{ display:inline-block; }
  .gallery.lead-mode .card-top{ align-items:center; }

  /* ---- Vendor combo box (searchable multi-select) ---- */
  .combo{ position:relative; }
  .combo-chips{ display:flex; flex-wrap:wrap; gap:4px; margin-bottom:4px; }
  .combo-chips:empty{ margin-bottom:0; }
  .chip{
    display:flex; align-items:center; gap:5px; background:#EEF1F5; color:var(--ink);
    font-size:11.5px; font-weight:600; padding:3px 6px 3px 9px; border-radius:12px;
  }
  .chip button{
    background:none; border:none; color:var(--muted); cursor:pointer; font-size:13px; line-height:1;
    padding:0; display:flex;
  }
  .combo-panel{
    display:none; position:absolute; top:100%; left:0; margin-top:4px; width:240px; max-height:260px;
    overflow-y:auto; overflow-x:hidden; background:#fff; border:1px solid var(--border); border-radius:8px;
    box-shadow:0 6px 20px rgba(24,33,47,.14); z-index:20;
  }
  .combo-panel.show{ display:block; }
  .combo-option{
    display:flex; align-items:flex-start; gap:8px; padding:8px 10px; font-size:13px; cursor:pointer; line-height:1.35;
  }
  .combo-option input[type="checkbox"]{ margin-top:2px; flex-shrink:0; }
  .combo-option:hover{ background:#F7F8FA; }
  .combo-empty{ padding:10px; font-size:12.5px; color:var(--muted); text-align:center; }
</style>
</head>
<body>

  <div id="signinScreen">
    <div class="card">
      <h1>Watchtower - Alerts App</h1>
      <p>Sign in with your muc-corp.com account to view today's alerts.</p>
      <button class="primary" id="loginBtn">Sign in</button>
    </div>
  </div>

  <div class="app" id="app">

    <div class="topbar">
      <div class="brand">
        <img src="logo.png" class="brand-mark" alt="Company logo">
        <div>
          <h1>Watchtower - Alerts App</h1>
          <p id="viewSubtitle">gallery view · Muc-corp</p>
        </div>
        <div class="view-toggle" id="viewToggle">
          <button type="button" data-view="gallery" class="active" aria-label="Gallery view">⊞</button>
          <button type="button" data-view="table" aria-label="Grid view">☰</button>
        </div>
      </div>
      <div class="who">
        <span id="whoLabel"></span>
        <button class="link" id="logoutBtn">Sign out</button>
      </div>
    </div>

    <div class="metrics">
      <div class="metric pending"><div class="num" id="metricPending">–</div><div class="label">Pending</div></div>
      <div class="metric critical"><div class="num" id="metricCritical">–</div><div class="label">Critical</div></div>
      <div class="metric entered"><div class="num" id="metricEntered">–</div><div class="label">Entered</div></div>
      <div class="metric"><div class="num" id="metricTotal">–</div><div class="label">Total today</div></div>
    </div>

    <div class="filterbar">
      <div class="field">
        <label>Client code</label>
        <input type="text" id="clientSearch" placeholder="Starts with…">
      </div>
      <div class="field">
        <label>Vendor</label>
        <div class="combo" id="vendorCombo">
          <div class="combo-chips" id="vendorChips"></div>
          <input type="text" id="vendorSearchInput" placeholder="All vendors" autocomplete="off">
          <div class="combo-panel" id="vendorPanel"></div>
        </div>
      </div>
      <div class="field">
        <label>Account number</label>
        <input type="text" id="accountSearch" placeholder="Search…">
      </div>
      <div class="field">
        <label>Alert type</label>
        <div class="status-seg" id="typeSeg">
          <button data-type="Billable">Billable</button>
          <button data-type="Supply">Supply</button>
          <button data-type="All" class="active">All</button>
        </div>
      </div>
      <div class="field">
        <label>Status</label>
        <div class="status-seg" id="statusSeg">
          <button data-status="Active" class="active">Active</button>
          <button data-status="Critical">Critical</button>
          <button data-status="Bill Pulled">Bill Pulled</button>
          <button data-status="Entered">Entered</button>
          <button data-status="Snoozed">Snoozed</button>
          <button data-status="All">All</button>
        </div>
      </div>
    </div>

    <div class="batchbar show" id="batchBar">
      <label style="display:none; align-items:center; gap:6px; cursor:pointer;">
      <input type="checkbox" id="selectAllCheckbox"> Select all
      </label>
      <strong id="batchCount">0 selected</strong>
      <div class="assignField" id="assignControls">
        <select id="batchAssignInput"></select>
        <button id="batchAssignBtn" disabled>Assign selected</button>
      </div>
      <button id="batchSnoozeBtn" class="snooze-btn" disabled>Snooze selected</button>
    </div>

    <div class="gallery lead-mode" id="gallery"></div>

    <div class="table-scroll" id="gridWrap">
      <table class="grid-table">
        <thead>
          <tr>
            <th></th>
            <th>Client code</th>
            <th>Client name</th>
            <th>Vendor</th>
            <th>Account #</th>
            <th>Status</th>
            <th>Last bill</th>
            <th>Billing period</th>
            <th>Days on alert</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="gridBody"></tbody>
      </table>
    </div>

    <div class="view-total" id="viewTotal"></div>

  </div>

  <div id="modalOverlay">
    <div class="modal" id="modalContent"></div>
  </div>

  <div id="popupOverlay">
    <div class="popup">
      <p class="popup-message" id="popupMessage"></p>
      <button id="popupOkBtn">OK</button>
    </div>
  </div>

<script>
  const CLIENT_ID = "6b04b1f9-b1d4-4366-aa47-12cbd7b9cd27";
  const TENANT_ID = "551cddfb-5bb5-4a53-aec6-063057585725";
  const API_SCOPE = `api://${CLIENT_ID}/access_as_user`;
  const BASE_URL = "https://alerts-functions-hpb5bfeah5fwe4df.eastus-01.azurewebsites.net/api";

  const msalConfig = {
    auth: {
      clientId: CLIENT_ID,
      authority: `https://login.microsoftonline.com/${TENANT_ID}`,
      redirectUri: window.location.origin + window.location.pathname
    },
    cache: { cacheLocation: "sessionStorage" }
  };
  const msalInstance = new msal.PublicClientApplication(msalConfig);

  const ASSIGNMENT_ENABLED = false;
  if (!ASSIGNMENT_ENABLED) {
    document.getElementById("assignControls").style.display = "none";
  }

  let statusFilter = "Active";
  let typeFilter = "All";
  let clientSearchDebounce = null;
  let accountSearchDebounce = null;
  let currentAlerts = [];
  let selectedIds = new Set();
  let teamMembers = [];
  let allVendors = [];
  let selectedVendors = new Set();
  let viewMode = localStorage.getItem("alertsViewMode") === "table" ? "table" : "gallery";

  function setViewState(signedIn) {
    document.getElementById("signinScreen").style.display = signedIn ? "none" : "flex";
    document.getElementById("app").style.display = signedIn ? "block" : "none";
  }

  function applyViewMode() {
    document.getElementById("gallery").style.display = viewMode === "gallery" ? "" : "none";
    document.getElementById("gridWrap").style.display = viewMode === "table" ? "" : "none";
    document.getElementById("viewSubtitle").textContent =
      (viewMode === "table" ? "grid" : "gallery") + " view · Muc-corp";
    document.querySelectorAll("#viewToggle button").forEach(b => {
      b.classList.toggle("active", b.dataset.view === viewMode);
      b.setAttribute("aria-pressed", b.dataset.view === viewMode ? "true" : "false");
    });
    if (currentAlerts.length === 0) {
      activeListContainer().innerHTML = listMessageHtml("empty-state", "No alerts match these filters.");
      const inactiveContainer = viewMode === "gallery" ? document.getElementById("gridBody") : document.getElementById("gallery");
      inactiveContainer.innerHTML = "";
    } else if (viewMode === "gallery") {
      document.getElementById("gallery").innerHTML = currentAlerts.map(renderCard).join("");
      document.getElementById("gridBody").innerHTML = "";
    } else {
      document.getElementById("gridBody").innerHTML = currentAlerts.map(renderRow).join("");
      document.getElementById("gallery").innerHTML = "";
    }
  }

  async function getToken() {
    const account = msalInstance.getActiveAccount();
    const res = await msalInstance.acquireTokenSilent({ scopes: [API_SCOPE], account });
    return res.accessToken;
  }

  async function callApi(path, options = {}) {
    const token = await getToken();
    const res = await fetch(BASE_URL + path, {
      ...options,
      headers: {
        "Authorization": "Bearer " + token,
        ...(options.body ? { "Content-Type": "application/json" } : {}),
        ...(options.headers || {})
      }
    });
    if (!res.ok) {
      const text = await res.text();
      throw new Error(`${res.status}: ${text}`);
    }
    return res.json();
  }

  function escapeHtml(str) {
    if (str === null || str === undefined) return "";
    return String(str).replace(/[&<>"']/g, c => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[c]));
  }

  function displayNote(latest, fallback) {
    const val = latest || fallback;
    if (!val) return "";
    if (val.trim().startsWith("{")) return "(see account details)";
    return val;
  }

  function keystoneUrl(alert) {
    const p = new URLSearchParams({
      account_number: alert.account_number || "",
      utility_company: alert.vendor || "",
      client_name: alert.client_name || ""
    });
    return "https://keystone-muc.up.railway.app/accounts/detail?" + p.toString();
  }

  function statusInfo(alert) {
    if (alert.entered) return { cls: "entered", label: "Entered" };
    if (alert.bill_pulled) return { cls: "pulled", label: "Bill Pulled" };
    return { cls: "pending", label: "Pending" };
  }

  // Mirror of CRITICAL_THRESHOLD_SQL in function_app.py — keep in sync
  function criticalThresholdDays(alert) {
    const period = String(alert.billing_period || "").trim().toLowerCase();
    if (period === "monthly") return 45;
    if (period === "quarterly") return 75;
    return 65;
  }

  function renderCard(alert) {
    const status = statusInfo(alert);
    const isCritical = (alert.days_since_last_bill != null && alert.days_since_last_bill >= criticalThresholdDays(alert));
    const isSnoozed = !!alert.snoozed_today;

    return `
      <div class="card status-${status.cls} ${isCritical ? "is-critical" : ""} ${isSnoozed ? "status-snoozed" : ""}" data-id="${alert.id}">
        <div class="card-top">
          <span>
            <input type="checkbox" class="card-check" data-id="${alert.id}" ${selectedIds.has(String(alert.id)) ? "checked" : ""}>
            <span class="client-code">${escapeHtml(alert.client_code)}</span>
          </span>
          <span class="pill-group">
            ${isCritical ? `<span class="status-pill critical">Critical</span>` : ""}${isSnoozed ? `<span class="status-pill snoozed">Snoozed</span>` : ""}<span class="status-pill ${status.cls}">${status.label}</span>
          </span>
        </div>
        <h3>${escapeHtml(alert.client_name)}</h3>
        <p class="vendor">${escapeHtml(alert.vendor)}</p>
        ${alert.account_number ? `<p class="account-no">${escapeHtml(alert.account_number)}</p>` : ""}

        <div class="card-row"><span>Last bill</span><span>${escapeHtml(alert.last_bill_date) || "—"}</span></div>
        <div class="card-row"><span>Billing</span><span>${escapeHtml(alert.billing_period) || "—"}</span></div>
        ${alert.days_alerted != null ? `<div class="card-row"><span>On alert</span><span>${alert.days_alerted}d</span></div>` : ""}
        ${!alert.entered && (!isCritical || isSnoozed) ? `
        <div class="card-footer">
          <button class="snooze-btn ${isSnoozed ? "active" : ""}" data-id="${alert.id}" data-snoozed="${isSnoozed}">${isSnoozed ? "Unsnooze" : "Snooze"}</button>
        </div>` : ""}
      </div>
    `;
  }

  function renderRow(alert) {
    const status = statusInfo(alert);
    const isCritical = (alert.days_since_last_bill != null && alert.days_since_last_bill >= criticalThresholdDays(alert));
    const isSnoozed = !!alert.snoozed_today;

    return `
      <tr class="row-card status-${status.cls} ${isCritical ? "is-critical" : ""} ${isSnoozed ? "status-snoozed" : ""}" data-id="${alert.id}">
        <td><input type="checkbox" class="card-check" data-id="${alert.id}" ${selectedIds.has(String(alert.id)) ? "checked" : ""}></td>
        <td class="mono">${escapeHtml(alert.client_code)}</td>
        <td>${escapeHtml(alert.client_name)}</td>
        <td>${escapeHtml(alert.vendor)}</td>
        <td class="mono">${alert.account_number ? escapeHtml(alert.account_number) : "—"}</td>
        <td>
          <span class="pill-group">
            ${isCritical ? `<span class="status-pill critical">Critical</span>` : ""}${isSnoozed ? `<span class="status-pill snoozed">Snoozed</span>` : ""}<span class="status-pill ${status.cls}">${status.label}</span>
          </span>
        </td>
        <td class="mono">${escapeHtml(alert.last_bill_date) || "—"}</td>
        <td class="mono">${escapeHtml(alert.billing_period) || "—"}</td>
        <td class="mono">${alert.days_alerted != null ? alert.days_alerted + "d" : "—"}</td>
        <td>
          ${!alert.entered && (!isCritical || isSnoozed) ? `<button class="snooze-btn ${isSnoozed ? "active" : ""}" data-id="${alert.id}" data-snoozed="${isSnoozed}">${isSnoozed ? "Unsnooze" : "Snooze"}</button>` : ""}
        </td>
      </tr>
    `;
  }

  function buildFilterParams() {
    const params = new URLSearchParams();
    if (typeFilter !== "All") params.set("alert_type", typeFilter);
    const clientSearch = document.getElementById("clientSearch").value.trim();
    if (clientSearch) params.set("client_code_search", clientSearch);
    const accountSearch = document.getElementById("accountSearch").value.trim();
    if (accountSearch) params.set("account_number_search", accountSearch);
    if (selectedVendors.size > 0) params.set("vendor", Array.from(selectedVendors).join(","));
    return params;
  }

  async function loadMetrics() {
    try {
      const m = await callApi("/metrics?" + buildFilterParams().toString());
      document.getElementById("metricPending").textContent = m.pending_count;
      document.getElementById("metricCritical").textContent = m.critical_count;
      document.getElementById("metricEntered").textContent = m.entered_count;
      document.getElementById("metricTotal").textContent = m.total_count;
    } catch (e) {
      console.error("metrics failed", e);
    }
  }

  async function loadVendors() {
    try {
      allVendors = await callApi("/vendors");
      renderVendorPanel("");
      renderVendorChips();
    } catch (e) {
      console.error("vendors failed", e);
    }
  }

  function renderVendorChips() {
    const chipsEl = document.getElementById("vendorChips");
    chipsEl.innerHTML = Array.from(selectedVendors).map(v => `
      <span class="chip">${escapeHtml(v)}<button data-vendor="${escapeHtml(v)}" class="chipRemove">&times;</button></span>
    `).join("");
  }

  function renderVendorPanel(searchText) {
    const panel = document.getElementById("vendorPanel");
    const filtered = allVendors.filter(v => v.toLowerCase().includes(searchText.toLowerCase()));
    if (filtered.length === 0) {
      panel.innerHTML = `<div class="combo-empty">No matching vendors</div>`;
      return;
    }
    panel.innerHTML = filtered.map(v => `
      <label class="combo-option">
        <input type="checkbox" class="vendorOption" data-vendor="${escapeHtml(v)}" ${selectedVendors.has(v) ? "checked" : ""}>
        ${escapeHtml(v)}
      </label>
    `).join("");
  }

  const vendorSearchInput = document.getElementById("vendorSearchInput");
  const vendorPanel = document.getElementById("vendorPanel");

  vendorSearchInput.addEventListener("focus", () => {
    renderVendorPanel(vendorSearchInput.value);
    vendorPanel.classList.add("show");
  });

  vendorSearchInput.addEventListener("input", () => {
    renderVendorPanel(vendorSearchInput.value);
    vendorPanel.classList.add("show");
  });

  vendorPanel.addEventListener("change", (e) => {
    if (!e.target.classList.contains("vendorOption")) return;
    const v = e.target.dataset.vendor;
    if (e.target.checked) selectedVendors.add(v); else selectedVendors.delete(v);
    renderVendorChips();
    loadAlerts();
    loadMetrics();
  });

  document.getElementById("vendorChips").addEventListener("click", (e) => {
    const btn = e.target.closest(".chipRemove");
    if (!btn) return;
    selectedVendors.delete(btn.dataset.vendor);
    renderVendorChips();
    renderVendorPanel(vendorSearchInput.value);
    loadAlerts();
    loadMetrics();
  });

  document.addEventListener("click", (e) => {
    if (!document.getElementById("vendorCombo").contains(e.target)) {
      vendorPanel.classList.remove("show");
    }
  });

  async function loadTeamMembers() {
    try {
      teamMembers = await callApi("/team-members");
      const batchSelect = document.getElementById("batchAssignInput");
      batchSelect.innerHTML = `<option value="">Select assignee…</option>` +
        teamMembers.map(m => `<option value="${escapeHtml(m)}">${escapeHtml(m)}</option>`).join("");
    } catch (e) {
      console.error("team-members failed", e);
    }
  }

  function activeListContainer() {
    return viewMode === "gallery" ? document.getElementById("gallery") : document.getElementById("gridBody");
  }

  function listMessageHtml(cls, message) {
    return viewMode === "gallery"
      ? `<div class="${cls}">${message}</div>`
      : `<tr><td colspan="10" class="${cls}">${message}</td></tr>`;
  }

  async function loadAlerts() {
    activeListContainer().innerHTML = listMessageHtml("loading-state", "Loading alerts…");

    const params = buildFilterParams();
    if (statusFilter !== "All") params.set("status", statusFilter);

    try {
      const alerts = await callApi("/alerts?" + params.toString());
      currentAlerts = alerts;
      if (alerts.length === 0) {
        activeListContainer().innerHTML = listMessageHtml("empty-state", "No alerts match these filters.");
        document.getElementById("viewTotal").textContent = "Total: 0";
        return;
      }
      applyViewMode();
      document.getElementById("viewTotal").textContent = "Total: " + alerts.length;
    } catch (e) {
      currentAlerts = [];
      activeListContainer().innerHTML = listMessageHtml("empty-state", `Couldn't load alerts: ${escapeHtml(e.message)}`);
      document.getElementById("viewTotal").textContent = "";
    }
  }

  async function handleAlertContainerClick(e) {
    if (e.target.classList.contains("card-check")) {
      const id = e.target.dataset.id;
      if (e.target.checked) selectedIds.add(id); else selectedIds.delete(id);
      updateBatchBar();
      return;
    }
    if (e.target.classList.contains("snooze-btn")) {
      e.stopPropagation();
      const id = e.target.dataset.id;
      const nextSnoozed = e.target.dataset.snoozed !== "true";
      e.target.disabled = true;
      try {
        await callApi(`/alerts/${id}`, {
          method: "PATCH",
          body: JSON.stringify({ snoozed_today: nextSnoozed })
        });
        await Promise.all([loadAlerts(), loadMetrics()]);
      } catch (err) {
        e.target.disabled = false;
        console.error("Snooze toggle failed", err);
        if (err.message.includes("Cannot snooze a Critical alert")) {
          showPopup("Critical alerts cannot be snoozed.");
        } else {
          showPopup("Couldn't update snooze state. Check console for details.");
        }
      }
      return;
    }
    const item = e.target.closest(".card, .row-card");
    if (!item) return;
    const alert = currentAlerts.find(a => String(a.id) === item.dataset.id);
    if (alert) openModal(alert);
  }

  document.getElementById("gallery").addEventListener("click", handleAlertContainerClick);
  document.getElementById("gridBody").addEventListener("click", handleAlertContainerClick);

  function updateBatchBar() {
    document.getElementById("batchCount").textContent = selectedIds.size + " selected";
    document.getElementById("batchAssignBtn").disabled = selectedIds.size === 0;
    document.getElementById("batchSnoozeBtn").disabled = selectedIds.size === 0;
  }
document.getElementById("selectAllCheckbox").addEventListener("change", (e) => {
  const checkboxes = document.querySelectorAll(".card-check");
  checkboxes.forEach(cb => {
    cb.checked = e.target.checked;
    if (e.target.checked) selectedIds.add(cb.dataset.id);
    else selectedIds.delete(cb.dataset.id);
  });
  updateBatchBar();
});
  document.getElementById("batchAssignBtn").addEventListener("click", async () => {
    const assignee = document.getElementById("batchAssignInput").value.trim();
    if (!assignee || selectedIds.size === 0) return;

    const btn = document.getElementById("batchAssignBtn");
    btn.disabled = true;
    btn.textContent = "Assigning…";

    const now = new Date().toISOString();
    try {
      await Promise.all(
        Array.from(selectedIds).map(id =>
          callApi(`/alerts/${id}`, {
            method: "PATCH",
            body: JSON.stringify({ assigned_to: assignee, assigned_at: now })
          })
        )
      );
      selectedIds.clear();
      document.getElementById("batchAssignInput").value = "";
      updateBatchBar();
      btn.textContent = "Assign selected";
      await loadAlerts();
    } catch (err) {
      btn.textContent = "Assign selected";
      btn.disabled = false;
      console.error("Batch assign failed", err);
      showPopup("Some assignments may have failed. Check console for details.");
    }
  });

  document.getElementById("batchSnoozeBtn").addEventListener("click", async () => {
    if (selectedIds.size === 0) return;
    const unsnoozing = statusFilter === "Snoozed";

    let targetIds = Array.from(selectedIds);
    let skippedCount = 0;
    if (!unsnoozing) {
      const criticalIds = new Set(
        currentAlerts
          .filter(a => !a.entered && a.days_since_last_bill != null && a.days_since_last_bill >= criticalThresholdDays(a))
          .map(a => String(a.id))
      );
      const filtered = targetIds.filter(id => !criticalIds.has(String(id)));
      skippedCount = targetIds.length - filtered.length;
      targetIds = filtered;
    }

    if (targetIds.length === 0) {
      showPopup("Critical alerts cannot be snoozed.");
      return;
    }

    const btn = document.getElementById("batchSnoozeBtn");
    btn.disabled = true;
    btn.textContent = unsnoozing ? "Unsnoozing…" : "Snoozing…";

    try {
      await Promise.all(
        targetIds.map(id =>
          callApi(`/alerts/${id}`, {
            method: "PATCH",
            body: JSON.stringify({ snoozed_today: !unsnoozing })
          })
        )
      );
      selectedIds.clear();
      updateBatchBar();
      btn.textContent = unsnoozing ? "Unsnooze selected" : "Snooze selected";
      await Promise.all([loadAlerts(), loadMetrics()]);
      if (skippedCount > 0) {
        showPopup(`${skippedCount} alert(s) skipped: Critical alerts cannot be snoozed.`);
      }
    } catch (err) {
      btn.textContent = unsnoozing ? "Unsnooze selected" : "Snooze selected";
      btn.disabled = selectedIds.size === 0;
      console.error("Batch snooze failed", err);
      showPopup("Some snooze updates may have failed. Check console for details.");
    }
  });

  function buildAssigneeOptions(selectedValue) {
    let opts = `<option value="">— Unassigned —</option>`;
    opts += teamMembers.map(m =>
      `<option value="${escapeHtml(m)}" ${m === selectedValue ? "selected" : ""}>${escapeHtml(m)}</option>`
    ).join("");
    return opts;
  }

  function renderModal(alert) {
    const status = statusInfo(alert);
    const isCritical = (alert.days_since_last_bill != null && alert.days_since_last_bill >= criticalThresholdDays(alert));
    const instructions = alert.account_instructions ? escapeHtml(alert.account_instructions) : "";

    return `
      <div class="modal-top">
        <h2>${escapeHtml(alert.client_name)}</h2>
        <button class="modal-close" id="modalCloseBtn">&times;</button>
      </div>
      <div class="modal-sub">${escapeHtml(alert.client_code)} · ${escapeHtml(alert.vendor)} · ${isCritical ? `<span class="status-pill critical">Critical</span> ` : ""}<span class="status-pill ${status.cls}">${status.label}</span></div>

      <div class="modal-grid">
        <div><div class="k">Account number</div><div class="v">${escapeHtml(alert.account_number)}</div></div>
        <div><div class="k">Account name</div><div class="v">${escapeHtml(alert.account_name)}</div></div>
        <div><div class="k">Tax ID</div><div class="v">${escapeHtml(alert.tax_id) || "—"}</div></div>
        <div><div class="k">Billing period</div><div class="v">${escapeHtml(alert.billing_period)}</div></div>
        <div><div class="k">Payment method</div><div class="v">${escapeHtml(alert.payment_method) || "—"}</div></div>
        <div><div class="k">Alert type</div><div class="v">${escapeHtml(alert.alert_type)}</div></div>
        <div><div class="k">Last bill date</div><div class="v">${escapeHtml(alert.last_bill_date) || "—"}</div></div>
        <div><div class="k">Last bill due</div><div class="v">${escapeHtml(alert.last_bill_due_date) || "—"}</div></div>
        <div><div class="k">Days since last bill</div><div class="v">${alert.days_since_last_bill != null ? alert.days_since_last_bill : "—"}</div></div>
        <div><div class="k">On alert for</div><div class="v">${alert.days_alerted != null ? alert.days_alerted + " days" : "—"}</div></div>
      </div>

      ${instructions ? `<div class="modal-field"><label>Account instructions</label><div class="modal-readonly">${instructions}</div></div>` : ""}

      ${(() => { const latest = displayNote(alert.latest_account_note, null); return latest ? `<div class="modal-field"><label>Latest V5 note</label><div class="modal-readonly">${escapeHtml(latest)}</div></div>` : ""; })()}

      <div class="modal-field">
        <label><input type="checkbox" id="modalBillPulledInput" ${alert.bill_pulled ? "checked" : ""} ${alert.entered ? "disabled" : ""}> Bill pulled</label>
        ${alert.entered ? `<div style="font-size:11.5px;color:var(--muted);margin-top:3px;">Already entered — bill pulled status no longer applies.</div>` : ""}
      </div>

      <div class="modal-field">
        <label>Add V5 note</label>
        <textarea id="modalNotesInput">${escapeHtml(alert.alert_notes || "")}</textarea>
      </div>

      ${ASSIGNMENT_ENABLED ? `
      <div class="modal-field">
        <label>Assigned to</label>
        <select id="modalAssignedInput">${buildAssigneeOptions(alert.assigned_to || "")}</select>
      </div>` : ""}

      <div class="modal-actions">
        <span class="modal-save-status" id="modalSaveStatus"></span>
        <div class="modal-buttons">
          <button class="keystone" onclick="window.open('${keystoneUrl(alert)}', '_blank')">Open in Keystone</button>
          <button class="save" id="modalSaveBtn">Save changes</button>
        </div>
      </div>
    `;
  }

  function openModal(alert) {
    document.getElementById("modalContent").innerHTML = renderModal(alert);
    document.getElementById("modalOverlay").classList.add("show");

    document.getElementById("modalCloseBtn").addEventListener("click", closeModal);

    document.getElementById("modalSaveBtn").addEventListener("click", async () => {
      const statusEl = document.getElementById("modalSaveStatus");
      const notes = document.getElementById("modalNotesInput").value;
      const billPulledEl = document.getElementById("modalBillPulledInput");
      const billPulled = billPulledEl.disabled ? alert.bill_pulled : billPulledEl.checked;
      let assignedFields = {};
      if (ASSIGNMENT_ENABLED) {
        const assignedTo = document.getElementById("modalAssignedInput").value.trim();
        assignedFields = { assigned_to: assignedTo || null, assigned_at: assignedTo ? new Date().toISOString() : null };
      }

      statusEl.textContent = "Saving…";
      try {
        await callApi(`/alerts/${alert.id}`, {
          method: "PATCH",
          body: JSON.stringify({
            alert_notes: notes,
            bill_pulled: billPulled,
            ...assignedFields
          })
        });
        statusEl.textContent = "Saved";
        await loadAlerts();
      } catch (err) {
        statusEl.textContent = "Failed to save";
        console.error(err);
      }
    });
  }

  function closeModal() {
    document.getElementById("modalOverlay").classList.remove("show");
  }

  document.getElementById("modalOverlay").addEventListener("click", (e) => {
    if (e.target.id === "modalOverlay") closeModal();
  });

  function showPopup(message) {
    document.getElementById("popupMessage").textContent = message;
    document.getElementById("popupOverlay").classList.add("show");
  }

  function closePopup() {
    document.getElementById("popupOverlay").classList.remove("show");
  }

  document.getElementById("popupOkBtn").addEventListener("click", closePopup);
  document.getElementById("popupOverlay").addEventListener("click", (e) => {
    if (e.target.id === "popupOverlay") closePopup();
  });

  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") { closeModal(); closePopup(); }
  });

  document.getElementById("typeSeg").addEventListener("click", (e) => {
    if (e.target.tagName !== "BUTTON") return;
    typeFilter = e.target.dataset.type;
    document.querySelectorAll("#typeSeg button").forEach(b => b.classList.remove("active"));
    e.target.classList.add("active");
    loadAlerts();
    loadMetrics();
  });

  document.getElementById("statusSeg").addEventListener("click", (e) => {
    if (e.target.tagName !== "BUTTON") return;
    statusFilter = e.target.dataset.status;
    document.querySelectorAll("#statusSeg button").forEach(b => b.classList.remove("active"));
    e.target.classList.add("active");
    document.getElementById("batchSnoozeBtn").textContent =
      statusFilter === "Snoozed" ? "Unsnooze selected" : "Snooze selected";
    loadAlerts();
  });

  document.getElementById("viewToggle").addEventListener("click", (e) => {
    const btn = e.target.closest("button[data-view]");
    if (!btn) return;
    viewMode = btn.dataset.view;
    localStorage.setItem("alertsViewMode", viewMode);
    applyViewMode();
  });

  applyViewMode();

  document.getElementById("clientSearch").addEventListener("input", () => {
    clearTimeout(clientSearchDebounce);
    clientSearchDebounce = setTimeout(() => { loadAlerts(); loadMetrics(); }, 350);
  });

  document.getElementById("accountSearch").addEventListener("input", () => {
    clearTimeout(accountSearchDebounce);
    accountSearchDebounce = setTimeout(() => { loadAlerts(); loadMetrics(); }, 350);
  });

  document.getElementById("loginBtn").addEventListener("click", () => {
    msalInstance.loginRedirect({ scopes: [API_SCOPE] });
  });

  document.getElementById("logoutBtn").addEventListener("click", () => {
    msalInstance.logoutRedirect();
  });

  async function init() {
    await msalInstance.initialize();
    const result = await msalInstance.handleRedirectPromise().catch(console.error);
    const account = result?.account || msalInstance.getAllAccounts()[0];

    if (!account) {
      setViewState(false);
      return;
    }
    msalInstance.setActiveAccount(account);
    setViewState(true);
    document.getElementById("whoLabel").textContent = account.username;

    await Promise.all([loadMetrics(), loadVendors(), ...(ASSIGNMENT_ENABLED ? [loadTeamMembers()] : [])]);
    await loadAlerts();
  }

  init();
</script>
</body>
</html>
